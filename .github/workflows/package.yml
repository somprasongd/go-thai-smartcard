# Packaging CI (decision 20): every installer in the v3 plan is built by
# GitHub Actions on GitHub-hosted runners — one workflow, one job per OS,
# triggered by the release tags the manual release workflow pushes. CI adds
# packages to the hand-cut GitHub release; it never cuts a release, and it
# does not run tests: test.yml handles PR/main verification (AGENTS.md).

name: package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Phase 2 + 4: the agent's .deb/.rpm (systemd unit, polkit rule, default
  # config) and the tray's .deb/.rpm (which depend on the agent's package).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # pkg/transport/pcsc is a cgo binding; the runner needs the headers
      # pkg-config points at (the README's own Linux requirement).
      - name: Install libpcsclite-dev
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config

      - name: Build the agent
        run: |
          go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME#v}" -o ./bin/thai-smartcard-agent.linux-amd64 ./cmd/agent
          test "$(./bin/thai-smartcard-agent.linux-amd64 --version)" = "${GITHUB_REF_NAME#v}"

      # cmd/tray is cgo too: fyne-io/systray talks to the desktop's appindicator
      # interface, so the headers must be on the runner before it builds.
      - name: Install tray build dependencies
        run: sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Build the tray
        run: CGO_ENABLED=1 go build -trimpath -o ./bin/thai-smartcard-tray.linux-amd64 ./cmd/tray

      - name: Install nfpm
        # go install pins the same version validated locally; release-asset
        # URLs have proven brittle (a 404 body written by curl -o is an
        # invalid .deb that dpkg only rejects afterwards).
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Package .deb and .rpm
        # nfpm takes the version from the config file, which expands
        # $NFPM_VERSION; there is no --version flag.
        env:
          NFPM_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ./dist
          NFPM_VERSION="$VERSION" "$(go env GOPATH)/bin/nfpm" package -p deb -f packaging/nfpm.yaml \
            -t "./dist/thai-smartcard-agent_${VERSION}_amd64.deb"
          NFPM_VERSION="$VERSION" "$(go env GOPATH)/bin/nfpm" package -p rpm -f packaging/nfpm.yaml \
            -t "./dist/thai-smartcard-agent-${VERSION}.x86_64.rpm"
          NFPM_VERSION="$VERSION" "$(go env GOPATH)/bin/nfpm" package -p deb -f packaging/nfpm-tray.yaml \
            -t "./dist/thai-smartcard-tray_${VERSION}_amd64.deb"
          NFPM_VERSION="$VERSION" "$(go env GOPATH)/bin/nfpm" package -p rpm -f packaging/nfpm-tray.yaml \
            -t "./dist/thai-smartcard-tray-${VERSION}.x86_64.rpm"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" ./dist/* --clobber

  # Phase 4: the Windows installer (Inno Setup). The tray is built with the
  # windowsgui flag so no console opens. Code signing is optional and skipped
  # for now — unsigned costs a SmartScreen "unknown publisher" warning; a
  # certificate, if one is added later, lives in Actions Secrets, never in
  # the repo.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the agent and the tray
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          go build -trimpath -ldflags "-X main.version=$releaseVersion" -o ./bin/thai-smartcard-agent.windows-amd64.exe ./cmd/agent
          if ((& ./bin/thai-smartcard-agent.windows-amd64.exe --version) -ne $releaseVersion) { throw "Agent version mismatch" }
          go build -trimpath -ldflags "-H=windowsgui" -o ./bin/thai-smartcard-tray.exe ./cmd/tray

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        env:
          VERSION: ${{ github.ref_name }}
        shell: cmd
        run: |
          set VERSION=%VERSION:v=%
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%VERSION% packaging\windows\installer.iss

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" "./thai-smartcard-setup-$($env:GITHUB_REF_NAME -replace '^v','').exe" --clobber
        shell: pwsh

  # Phase 4: the macOS .pkg, built with pkgbuild, which ships with macOS. The
  # tray's cgo compiles against the runner's Xcode; a universal binary comes
  # from building both architectures and lipo-ing them. The tray .app must be
  # signed and notarized before it reaches users — the steps run only when
  # the Apple Developer secrets are set (an App Store Connect API key and an
  # installer signing identity live in Actions Secrets, never in the repo).
  macos:
    runs-on: macos-latest
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" packaging/macos/build-pkg.sh

      - name: Sign and notarize
        if: env.MACOS_SIGNING_IDENTITY != ''
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          PKG="build/thai-smartcard-agent-${VERSION}.pkg"
          codesign --deep --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" build/pkgroot/Applications/ThaiSmartcardTray.app
          codesign --force --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" build/pkgroot/usr/local/bin/thai-smartcard-agent
          codesign --verify --deep --strict build/pkgroot/Applications/ThaiSmartcardTray.app
          codesign --verify --strict build/pkgroot/usr/local/bin/thai-smartcard-agent
          pkgbuild --root build/pkgroot --scripts packaging/macos/scripts \
            --identifier com.thaismartcard.agent --version "$VERSION" \
            --install-location / "$PKG"
          echo "$APPLE_API_KEY_BASE64" | base64 -d > /tmp/apple_api_key.p8
          xcrun notarytool store-credentials thaismartcard \
            --key /tmp/apple_api_key.p8 --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"
          xcrun notarytool submit "$PKG" --keychain-profile thaismartcard --wait
          xcrun stapler staple "$PKG"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          gh release upload "$GITHUB_REF_NAME" "build/thai-smartcard-agent-${VERSION}.pkg" --clobber
