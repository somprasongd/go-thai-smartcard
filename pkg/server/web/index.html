<!DOCTYPE html>
<html lang="th" data-lang="th" data-privacy="kiosk" data-view="card">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SMC — Thai ID Card Agent</title>
    <!--
      socket.io's Go server (googollee/go-socket.io) speaks the protocol but does
      not ship the JavaScript client, so when socket.io is enabled it has to come
      from a CDN. The script is injected from boot() only after /api/info says the
      transport is on: a switched-off transport is never fetched, and when the
      script cannot load the page still works over the dependency-free WebSocket.
    -->
    <style>
      /* ---------------------------------------------------------------------
         Design system: "แผงควบคุมเครื่องอ่านบัตร" — a light admin console.
         One white shell (app bar + sidebar) on a quiet mint-gray desk; a
         single accent, the deep green of the Thai ID card itself, means
         action or state. Gold survives only on the card document, where it
         marks the identity band. The card is the one loud object; everything
         around it is hairlines and whitespace. Thai-first system type; mono
         only where the content is actually numeric.
         --------------------------------------------------------------------- */
      :root {
        --bg: #f4f6f5;
        --surface: #ffffff;
        --surface-2: #f0f4f2;
        --line: #e1e7e4;
        --line-soft: #ebefed;
        --fg: #17251f;
        --fg-dim: #5a6b64;
        --fg-faint: #8d9c95;
        --accent: #0c7a5b;
        --accent-deep: #095f47;
        --accent-soft: #e2f1ea;
        --gold: #c9a75c;
        --ok: #17855c;
        --warn: #b45309;
        --danger: #d64550;

        /* Card stock: the document itself, paper-white under a green band */
        --card-bg: #ffffff;
        --card-fg: #1c2b25;
        --card-dim: #6b7c75;
        --card-line: #e3e8e5;
        --card-accent: #0a6b52;

        --radius: 12px;
        --radius-sm: 8px;
        --appbar-h: 57px;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: "Sukhumvit Set", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans Thai", "Leelawadee UI", Sarabun, Roboto, sans-serif;
        --scale: 1;
      }

      /* Counter mode: same layout, read from further away. */
      html[data-privacy="counter"] {
        --scale: 1.28;
      }

      * {
        box-sizing: border-box;
      }

      /* The layout sets display on .blocks, .pill and .lightbox, and an author
         display rule outranks the UA stylesheet's [hidden] { display: none }.
         Without this, toggling the hidden attribute silently does nothing. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: calc(15px * var(--scale));
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ----------------------------- app bar ----------------------------- */
      .appbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        min-height: var(--appbar-h);
        padding: 8px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--fg);
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-right: auto;
      }

      /* The mark: a small green tile, the only strong colour up here. */
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, #0d805f, #085c45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        display: grid;
        place-items: center;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.07em;
        color: #fff;
        flex: none;
      }

      .pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        font-size: 12px;
        color: var(--fg-dim);
        white-space: nowrap;
      }

      .pill b {
        color: var(--fg);
        font-weight: 600;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--fg-faint);
        flex: none;
      }

      .dot.on {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(23, 133, 92, 0.16);
      }

      .dot.off {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(214, 69, 80, 0.14);
      }

      .dot.wait {
        background: var(--warn);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .iconbtn {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        color: var(--fg-dim);
        background: transparent;
        border: 1px solid transparent;
        flex: none;
      }

      .iconbtn:hover {
        background: var(--surface-2);
        color: var(--fg);
        border-color: var(--line);
      }

      /* The app bar's interface-language toggle: a compact seg. */
      .langseg {
        grid-auto-columns: auto;
        padding: 2px;
        border-radius: 8px;
      }

      .langseg button {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 6px;
      }

      /* Sidebar collapse: the hide button sits at the sidebar's top-right,
         and once it is hidden the same icon appears in the app bar to bring
         it back. The choice is a preference like the view. */
      .side-top {
        display: flex;
        justify-content: flex-end;
        padding: 6px 10px 0;
      }

      .side-open {
        display: none;
        margin-right: 2px;
      }

      html.side-hidden .side-open {
        display: inline-grid;
      }

      html.side-hidden .sidebar {
        display: none !important;
      }

      html.side-hidden .shell {
        grid-template-columns: minmax(0, 1fr);
      }

      /* ------------------------------ shell ------------------------------ */
      .shell {
        display: grid;
        grid-template-columns: 266px minmax(0, 1fr);
        align-items: start;
      }

      .sidebar {
        position: sticky;
        top: var(--appbar-h);
        height: calc(100vh - var(--appbar-h));
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 14px 0 28px;
      }

      .nav {
        display: grid;
        gap: 2px;
        padding: 0 12px 14px;
        border-bottom: 1px solid var(--line-soft);
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        text-decoration: none;
        color: var(--fg-dim);
        font-size: 13.5px;
        font-weight: 550;
      }

      .nav-item svg {
        flex: none;
        color: var(--fg-faint);
      }

      .nav-item:hover {
        background: var(--surface-2);
        color: var(--fg);
      }

      .nav-item:hover svg {
        color: var(--fg-dim);
      }

      .nav-item.is-active {
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-weight: 650;
      }

      .nav-item.is-active svg {
        color: var(--accent);
      }

      .side-sec {
        padding: 16px 16px 4px;
      }

      .side-sec + .side-sec {
        border-top: 1px solid var(--line-soft);
        margin-top: 12px;
      }

      .side-label {
        margin: 0 0 10px;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--fg);
      }

      .group {
        margin: 0 0 14px;
      }

      .group-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-faint);
        margin: 0 0 8px;
      }

      /* ------------------------------- main ------------------------------ */
      main {
        display: grid;
        gap: 18px;
        align-content: start;
        padding: 24px 28px 48px;
        width: 100%;
        max-width: 1360px;
        margin: 0 auto;
      }

      /* Work area: the card (and its blocks) beside a rail that keeps the
         event log on screen while the page scrolls. */
      .workarea {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 336px;
        gap: 18px;
        align-items: start;
      }

      /* The rail is only worth its width while the log is on. */
      .workarea:has(#panel-log[hidden]) {
        grid-template-columns: minmax(0, 1fr);
      }

      .work-main {
        display: grid;
        gap: 18px;
        align-content: start;
        min-width: 0;
      }

      #panel-log {
        position: sticky;
        top: calc(var(--appbar-h) + 18px);
      }

      #panel-log .log {
        max-height: min(58vh, 560px);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .panel > h2 {
        margin: 0;
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 650;
        color: var(--fg-dim);
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel > h2 .count {
        margin-left: auto;
        font-weight: 500;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-faint);
      }

      .panel-body {
        padding: 14px 16px;
      }

      /* --------------------------- empty state --------------------------- */
      .stage {
        min-height: min(62vh, 640px);
        display: grid;
        place-items: center;
      }

      .empty {
        text-align: center;
        padding: 40px 24px;
        max-width: 520px;
      }

      /* The reader slot: a card waiting above the mouth of the slot. The JS
         writes an emoji in here for assistive tech; visually it is replaced
         by the drawn slot. */
      .empty-icon {
        position: relative;
        width: 132px;
        height: 78px;
        margin: 0 auto 20px;
        font-size: 0;
      }

      .empty-icon::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 84px;
        height: 54px;
        border-radius: 8px;
        background: linear-gradient(var(--accent) 0 9px, var(--card-bg) 9px);
        border: 1px solid var(--card-line);
        box-shadow: 0 16px 28px -14px rgba(23, 37, 31, 0.35);
      }

      .empty-icon::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 132px;
        height: 14px;
        border-radius: 999px;
        background: #e6ebe8;
        border: 1px solid var(--line);
        box-shadow: inset 0 2px 5px rgba(23, 37, 31, 0.12);
      }

      .empty h3 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 650;
      }

      .empty p {
        margin: 0 0 6px;
        color: var(--fg-dim);
        font-size: 14px;
      }

      .empty .hint {
        color: var(--fg-faint);
        font-size: 13px;
        margin-top: 12px;
      }

      .empty code {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1.5px 6px;
        color: var(--accent-deep);
      }

      .empty.is-error .empty-icon::before {
        background: linear-gradient(var(--danger) 0 9px, #fdf1f2 9px);
        border-color: rgba(214, 69, 80, 0.5);
      }

      .empty.is-error .empty-icon::after {
        border-color: rgba(214, 69, 80, 0.5);
      }

      /* ------------------------------ the card --------------------------- */
      .idcard {
        width: 100%;
        max-width: 880px;
        background: var(--card-bg);
        color: var(--card-fg);
        border-radius: 16px;
        border: 1px solid var(--card-line);
        box-shadow: 0 30px 60px -30px rgba(23, 37, 31, 0.3),
          0 2px 6px -2px rgba(23, 37, 31, 0.08);
        position: relative;
        overflow: hidden;
      }

      /* Faint guilloche wash, kept under the content. */
      .idcard::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          115deg,
          rgba(12, 122, 91, 0.025) 0 2px,
          transparent 2px 7px
        );
        pointer-events: none;
      }

      .idcard-top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        background: linear-gradient(120deg, #0d805f, #085c45);
        border-bottom: 2px solid var(--gold);
        color: #fff;
        position: relative;
      }

      .idcard-top .emblem {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.13);
        box-shadow: 0 0 0 1.5px var(--gold);
        color: #f3e6c8;
        display: grid;
        place-items: center;
        font-size: 14px;
        flex: none;
      }

      .idcard-title {
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.02em;
        color: #fff;
      }

      .idcard-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.72);
        letter-spacing: 0.04em;
      }

      .idcard-body {
        display: grid;
        grid-template-columns: 172px minmax(0, 1fr);
        gap: 22px;
        padding: 22px;
        position: relative;
      }

      @media (max-width: 620px) {
        .idcard-body {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      html[data-privacy="counter"] .idcard-body {
        grid-template-columns: 224px minmax(0, 1fr);
        gap: 28px;
        padding: 30px;
      }

      .photo-wrap {
        position: relative;
      }

      .photo {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--card-line);
        background: #eef1ef;
        display: block;
        cursor: zoom-in;
      }

      .photo-empty {
        width: 100%;
        aspect-ratio: 3 / 4;
        border-radius: 8px;
        border: 1px dashed var(--card-line);
        background: #f3f6f4;
        display: grid;
        place-items: center;
        color: var(--card-dim);
        font-size: 12px;
        text-align: center;
        padding: 10px;
      }

      .photo.is-masked {
        filter: blur(18px) grayscale(0.4);
      }

      .fields {
        display: grid;
        gap: 12px;
        align-content: start;
        min-width: 0;
      }

      .f {
        display: grid;
        grid-template-columns: 122px minmax(0, 1fr);
        gap: 10px;
        align-items: baseline;
        min-width: 0;
      }

      .f-label {
        font-size: 11.5px;
        letter-spacing: 0.01em;
        color: var(--card-dim);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      html[data-privacy="counter"] .f-label {
        font-size: 13.5px;
      }

      /* Bigger type needs a wider label column or long Thai labels truncate. */
      html[data-privacy="counter"] .f {
        grid-template-columns: 156px minmax(0, 1fr);
      }

      .f-value {
        font-size: 15px;
        font-weight: 550;
        word-break: break-word;
        min-width: 0;
      }

      html[data-privacy="counter"] .f-value {
        font-size: 19px;
      }

      .f-value.mono {
        font-family: var(--mono);
        letter-spacing: 0.05em;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .f-value.big {
        font-size: calc(20px * var(--scale));
        font-weight: 700;
        line-height: 1.3;
      }

      .f-value.is-empty {
        color: var(--card-dim);
        font-weight: 400;
        font-style: italic;
      }

      /* Chips the page works out itself: age, days left, checksum. */
      .f-value .derived {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 8px;
        border-radius: 999px;
        background: rgba(23, 37, 31, 0.05);
        border: 1px solid var(--card-line);
        font-size: 11px;
        font-weight: 650;
        font-family: var(--sans);
        color: var(--card-dim);
        font-style: normal;
        vertical-align: 1px;
      }

      .f-value .derived.ok {
        color: #116b45;
        border-color: rgba(17, 107, 69, 0.32);
        background: rgba(17, 107, 69, 0.07);
      }

      .f-value .derived.warn {
        color: #8a5a06;
        border-color: rgba(138, 90, 6, 0.32);
        background: rgba(138, 90, 6, 0.07);
      }

      .f-value .derived.bad {
        color: #b4233a;
        border-color: rgba(180, 35, 58, 0.32);
        background: rgba(180, 35, 58, 0.07);
      }

      .f-value .copy-btn {
        margin-left: 8px;
        padding: 2px 8px;
        font-size: 11px;
        font-family: var(--sans);
        background: transparent;
        color: var(--card-dim);
        border: 1px solid var(--card-line);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.12s;
        vertical-align: baseline;
      }

      .f-value .copy-btn:hover {
        background: var(--surface-2);
        color: var(--card-fg);
        border-color: var(--fg-faint);
      }

      .f:hover .copy-btn,
      .f-value .copy-btn:focus-visible {
        opacity: 1;
      }

      /* Nothing to hover on a touch screen, so keep the affordance visible. */
      @media (hover: none) {
        .f-value .copy-btn {
          opacity: 0.7;
        }
      }

      .idcard-foot {
        padding: 12px 22px;
        border-top: 1px solid var(--card-line);
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
        align-items: center;
        justify-content: space-between;
        position: relative;
      }

      .idcard-foot .meta {
        font-size: 11.5px;
        color: var(--card-dim);
      }

      /* The one orchestrated moment: the card answers an actual read. */
      .flash {
        animation: cardflash 0.9s ease-out;
      }

      @keyframes cardflash {
        0% {
          box-shadow: 0 0 0 4px rgba(12, 122, 91, 0.4),
            0 30px 60px -30px rgba(23, 37, 31, 0.3);
        }
        100% {
          box-shadow: 0 30px 60px -30px rgba(23, 37, 31, 0.3),
            0 2px 6px -2px rgba(23, 37, 31, 0.08);
        }
      }

      /* --------------------------- extra blocks -------------------------- */
      .blocks {
        display: grid;
        gap: 18px;
      }

      .kv {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px 18px;
      }

      .kv .f {
        grid-template-columns: 132px minmax(0, 1fr);
        padding-bottom: 7px;
        border-bottom: 1px solid var(--line-soft);
      }

      .kv .f-label {
        font-size: 12.5px;
        color: var(--fg-dim);
        font-weight: 550;
      }

      .kv .f-value {
        font-size: 13.5px;
        color: var(--fg);
      }

      .absent {
        padding: 12px 14px;
        border: 1px dashed var(--line);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        color: var(--fg-dim);
        font-size: 13px;
      }

      .absent code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--warn);
      }

      .absent a {
        color: var(--accent-deep);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* ------------------------------ table ------------------------------ */
      table.fields-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .fields-table th,
      .fields-table td {
        text-align: left;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line-soft);
        vertical-align: top;
      }

      .fields-table th {
        color: var(--fg-dim);
        font-weight: 650;
        font-size: 12px;
        background: var(--surface-2);
      }

      .fields-table td.key {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg-faint);
        white-space: nowrap;
      }

      .fields-table td.lbl {
        color: var(--fg-dim);
        font-size: 12px;
        white-space: nowrap;
      }

      .fields-table td.val {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        word-break: break-word;
      }

      .fields-table td.val.is-empty {
        color: var(--fg-faint);
        font-style: italic;
      }

      .fields-table tr.group-head td {
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-weight: 700;
        font-size: 12px;
      }

      .table-scroll {
        /* No inner scrollbar: the page already scrolls, and two nested
           scrollbars on one table is a trap to scroll the wrong one. */
        overflow: visible;
      }

      /* ----------------------------- controls ---------------------------- */
      .seg {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 3px;
        padding: 3px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 9px;
      }

      .seg button {
        border: 0;
        background: transparent;
        color: var(--fg-dim);
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 550;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
      }

      .seg button:hover {
        color: var(--fg);
      }

      .seg button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--accent-deep);
        font-weight: 650;
        box-shadow: 0 1px 2.5px rgba(23, 37, 31, 0.16);
      }

      .check {
        display: flex;
        gap: 9px;
        align-items: baseline;
        padding: 3px 0;
        cursor: pointer;
      }

      .check input {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
        flex: none;
      }

      .check .sub {
        display: block;
        font-size: 12px;
        color: var(--fg-faint);
        font-weight: 400;
      }

      .field-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0;
      }

      .field-row label {
        color: var(--fg-dim);
        min-width: 110px;
      }

      .field-row select {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 9px;
        font-family: var(--sans);
        font-size: 13.5px;
      }

      .note {
        color: var(--fg-faint);
        font-size: 12.5px;
        margin: 6px 0 0;
      }

      .btn {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 14px;
        font-family: var(--sans);
        font-size: 13.5px;
        font-weight: 550;
        cursor: pointer;
      }

      .btn:hover {
        background: var(--surface-2);
        border-color: var(--fg-faint);
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 650;
      }

      .btn.primary:hover {
        background: var(--accent-deep);
        border-color: var(--accent-deep);
      }

      .btn.wide {
        width: 100%;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .btn.primary:disabled {
        background: var(--accent);
      }

      /* The card's own copy button sits on the document: quiet ink on paper. */
      .idcard-foot .btn {
        background: transparent;
        border-color: var(--card-line);
        color: var(--card-fg);
      }

      .idcard-foot .btn:hover {
        background: var(--surface-2);
        border-color: var(--card-dim);
      }

      /* --------------------------- side panels --------------------------- */
      pre.json {
        margin: 0;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
        color: var(--fg-dim);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .log {
        max-height: 300px;
        overflow-y: auto;
        padding: 8px 0;
      }

      .log-row {
        display: grid;
        grid-template-columns: 62px 92px minmax(0, 1fr);
        gap: 8px;
        padding: 3px 16px;
        font-size: 12px;
      }

      .log-row .t {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        color: var(--fg-faint);
      }

      .log-row .ev {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent-deep);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .log-row .m {
        color: var(--fg-dim);
        word-break: break-word;
      }

      /* --------------------------- lightbox/toast ------------------------ */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(13, 22, 18, 0.92);
        display: grid;
        place-items: center;
        cursor: zoom-out;
        padding: 24px;
      }

      .lightbox img {
        max-width: min(92vw, 560px);
        max-height: 88vh;
        border-radius: 10px;
        border: 1px solid var(--line);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(8px);
        background: #1d2b25;
        color: #f2f6f4;
        border: 1px solid #31423b;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 13.5px;
        box-shadow: 0 18px 40px -16px rgba(13, 22, 18, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
        z-index: 60;
        max-width: min(92vw, 480px);
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .toast.err {
        border-color: rgba(214, 69, 80, 0.6);
      }

      /* ---------------------------- responsive --------------------------- */
      @media (max-width: 1240px) {
        .workarea {
          grid-template-columns: minmax(0, 1fr);
        }

        #panel-log {
          position: static;
        }

        #panel-log .log {
          max-height: 300px;
        }
      }

      @media (max-width: 1080px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }

        /* The sidebar unpacks on mobile so the order becomes nav, then the
           card, then the control groups — someone holding a phone should not
           scroll past every control to reach the read. */
        .sidebar {
          display: contents;
        }

        .sidebar > .side-top {
          order: -2;
          padding: 4px 12px 0;
        }

        .sidebar > .nav {
          order: -1;
          background: var(--surface);
          border-bottom: 1px solid var(--line);
          padding: 12px;
        }

        .sidebar > .side-sec {
          order: 1;
          background: var(--surface);
        }

        main {
          padding: 20px 16px 40px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
      </style>
  </head>

        var DEFAULTS = {
          privacy: "kiosk",
          view: "card",
          lang: "th",

          // interface language (lang) is a separate th/en switch in the app
          // bar — one screen cannot be "both".
          dataLang: "th",
          photo: true,
          parts: true,
          nameparts: true,
          json: false,
          log: true,
          mask: false,
          maskphoto: false,
          autoclear: 0,
          sideHidden: false
        };

        // mask hides digits of the ID number, maskphoto blurs the portrait.
        // They are separate because they are separate decisions: a screen that
        // must not print the ID usually still has to show the face, and one
        // that blurs the face usually still has to read the number back.
        // Kiosk blurs the portrait as well as masking the number: on a screen
        // anyone can walk up to, a readable face is the bigger exposure. Both
        // stay separate switches, so an operator who needs the face for a check
        // can turn just that one off.
        // Kiosk clears the moment the card leaves: nothing on the screen is
        // worth a stranger reading after the person has walked away. Operators
        // who want a grace period pick one in the Auto-clear select.
        var PRIVACY = {
          kiosk: { mask: true, maskphoto: true, photo: true, json: false, autoclear: 0, nameparts: false, parts: false },
          dev: { mask: false, maskphoto: false, photo: true, json: true, autoclear: 0, nameparts: true, parts: true },
          counter: { mask: false, maskphoto: false, photo: true, json: false, autoclear: 0, nameparts: false, parts: false }
        };

        // Respect explicit preferences on reload; derive a preset on first visit.
        var hadStoredPrefs = false;
        var store = {
          ui: loadPrefs(),
          data: null,
          reader: "",
          // What the agent reports in smc-status. "selected" is the reader the
          // agent watches, which is configuration now and only displayed here.
          readers: [],
          selected: "",
          state: "",
          lastError: "",
          conn: { sio: false, ws: false, ever: false }
        };

        function loadPrefs() {
          var base = {};
          for (var k in DEFAULTS) base[k] = DEFAULTS[k];
          try {
            var raw = localStorage.getItem("smc.prefs");
            if (raw) {
              var saved = JSON.parse(raw);
              for (var j in saved) {
                if (Object.prototype.hasOwnProperty.call(base, j)) base[j] = saved[j];
              }
              hadStoredPrefs = true;
              // Older builds kept one switch for both the interface and the
              // card display. Split it so neither choice is lost: th/en prefs
              // agree with the old behaviour, and "both" becomes UI Thai with
              // the card showing both names.
              if (saved.lang && saved.dataLang === undefined) {
                base.dataLang = saved.lang;
                if (saved.lang === "both") base.lang = "th";
              }
            }
          } catch (e) {
            /* private mode, or a corrupt entry — defaults are fine */
          }
          return base;
        }

        function savePrefs() {
          try {
            localStorage.setItem("smc.prefs", JSON.stringify(store.ui));
          } catch (e) {
            /* nothing to do */
          }
        }

        /* ------------------------------ helpers ---------------------------- */
        function $(id) {
          return document.getElementById(id);
        }

        function t(key) {
          var lang = store.ui.lang === "en" ? "en" : "th";
          if (I18N[lang] && I18N[lang][key]) return I18N[lang][key];
          return I18N.th[key] || I18N.en[key] || key;
        }

        // Card data is untrusted text off a reader: always via textContent.
        function make(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text !== undefined && text !== null) n.textContent = String(text);
          return n;
        }

        function clear(node) {
          while (node.firstChild) node.removeChild(node.firstChild);
          return node;
        }

        function get(obj, path) {
          var cur = obj;
          var parts = path.split(".");
          for (var i = 0; i < parts.length; i++) {
            if (cur === null || cur === undefined) return undefined;
            cur = cur[parts[i]];
          }
          return cur;
        }

        function toast(msg, isErr) {
          var el = $("toast");
          el.textContent = msg;
          el.className = "toast show" + (isErr ? " err" : "");
          clearTimeout(toast._t);
          toast._t = setTimeout(function () {
            el.className = "toast";
          }, 1900);
        }

        function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          }
          // http:// on a LAN host is not a secure context, so fall back.
          return new Promise(function (resolve, reject) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy") ? resolve() : reject();
            } catch (e) {
              reject(e);
            }
            document.body.removeChild(ta);
          });
        }

        /* --------------------------- derivations --------------------------- */
        // Dates arrive already converted to Gregorian by the Go side
        // (NewFormatedDate subtracts 543), so these are plain YYYY-MM-DD.

        function parseDate(s) {
          if (!s || typeof s !== "string") return null;
          var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
          if (!m) return null;
          var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
          return isNaN(d.getTime()) ? null : d;
        }

        function ageFrom(dob) {
          var d = parseDate(dob);
          if (!d) return null;
          var now = new Date();
          var age = now.getFullYear() - d.getFullYear();
          var m = now.getMonth() - d.getMonth();
          if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
          return age >= 0 && age < 130 ? age : null;
        }

        function daysUntil(dateStr) {
          var d = parseDate(dateStr);
          if (!d) return null;
          var now = new Date();
          now.setHours(0, 0, 0, 0);
          return Math.round((d.getTime() - now.getTime()) / 86400000);
        }

        // The card sends "1"/"2"; the Go side does no mapping of its own.
        function genderLabel(g) {
          if (g === "1") return t("gender.male");
          if (g === "2") return t("gender.female");
          return "";
        }

        function maskCid(cid) {
          if (!cid || cid.length < 5) return cid || "";
          return cid.slice(0, 2) + new Array(cid.length - 3).join("•") + cid.slice(-1);
        }

        function formatCid(cid) {
          if (!cid || cid.length !== 13) return cid || "";
          return cid.slice(0, 1) + "-" + cid.slice(1, 5) + "-" + cid.slice(5, 10) + "-" +
            cid.slice(10, 12) + "-" + cid.slice(12);
        }

        // Standard Thai national ID checksum over the first 12 digits.
        function cidValid(cid) {
          if (!cid || cid.length !== 13 || !/^\d{13}$/.test(cid)) return null;
          var sum = 0;
          for (var i = 0; i < 12; i++) sum += Number(cid.charAt(i)) * (13 - i);
          var check = 11 - (sum % 11);
          if (check >= 10) check -= 10;
          return check === Number(cid.charAt(12));
        }

        // The laser code is printed on the card as AA0-0000000-00 (3-7-2),
        // so that is how the page shows it. A length that is not 12 is shown
        // raw rather than cut to fit the pattern.
        function groupLaser(s) {
          if (!s) return "";
          var m = s.match(/^(.{3})(.{7})(.{2})$/);
          return m ? m[1] + "-" + m[2] + "-" + m[3] : s;
        }

        /* ----------------------------- rendering --------------------------- */
        function fieldNode(label, value, opts) {
          opts = opts || {};
          var text =
            value === undefined || value === null || value === "" ? "" : String(value);

          // In a list of parts, a row the card simply did not fill in is noise:
          // "no soi" does not need its own line.
          if (!text && opts.hideEmpty) return null;

          var row = make("div", "f");
          row.appendChild(make("span", "f-label", label));

          var v = make("span", "f-value");
          if (opts.mono) v.className += " mono";
          if (opts.big) v.className += " big";

          if (!text) {
            v.className += " is-empty";
            v.textContent = t("empty.value");
          } else {
            v.textContent = text;
          }

          (opts.badges || []).forEach(function (b) {
            v.appendChild(make("span", "derived" + (b.tone ? " " + b.tone : ""), b.text));
          });

          if (text && opts.copyable) {
            var b = make("button", "btn copy-btn", t("act.copy"));
            b.type = "button";
            b.addEventListener("click", function () {
              copyText(text).then(
                function () {
                  toast(t("act.copied"));
                },
                function () {
                  toast(t("copy.failed"), true);
                }
              );
            });
            v.appendChild(b);
          }

          row.appendChild(v);
          return row;
        }

        function appendField(parent, label, value, opts) {
          var row = fieldNode(label, value, opts);
          if (row) parent.appendChild(row);
        }

        function nameFields(node, nameObj, isEng) {
          var labelSet = {
            prefix: "f.prefix",
            firstName: "f.firstName",
            middleName: "f.middleName",
            lastName: "f.lastName"
          };
          var order = ["prefix", "first_name", "middle_name", "last_name"];
          var keys = ["prefix", "firstName", "middleName", "lastName"];

          order.forEach(function (pathKey, i) {
            var raw = nameObj ? nameObj[pathKey] : "";
            if (!raw) return; // a part the card left blank is not worth a row
            var val = raw;
            if (pathKey === "prefix" && isEng) {
              // Go concatenates prefix+first with no separator, which reads
              // "Mr.Somprasong"; restore the space for the English name.
              val = raw.replace(/\s+/g, "");
              var first = nameObj.first_name || "";
              val = val + " " + first;
            }
            appendField(
              node,
              t(labelSet[keys[i]]),
              val,
              { mono: isEng, copyable: true }

        function renderCard() {
          var d = store.data;

        function groupById(id) {

        function renderBlocks() {

        // An absent applet is a configuration fact, not a mystery: say which
        // env var turns it on.
        // Hint text is mostly plain, but may carry <code>…</code> chips and a
        // <settings>…</settings> link to the settings page, where the read
        // toggles live; everything else becomes a plain text node.
        function hintBox(i18nKey) {
          var box = make("div", "absent");
          var code = null;
          var link = null;
          t(i18nKey)
            .split(/(<code>|<\/code>|<settings>|<\/settings>)/)
            .forEach(function (part) {
              if (!part) return;
              if (part === "<code>") {
                code = make("code");
                box.appendChild(code);
              } else if (part === "</code>") {
                code = null;
              } else if (part === "<settings>") {
                link = make("a");
                link.href = "/settings";
                box.appendChild(link);
              } else if (part === "</settings>") {
                link = null;
              } else if (code) {
                code.textContent += part;
              } else if (link) {
                link.textContent += part;
              } else {
                box.appendChild(document.createTextNode(part));
              }
            });
          return box;
        }

        function showEmpty(kind) {
          $("empty").hidden = false;
          $("data").hidden = true;
          $("blocks").hidden = true;
          var e = $("empty");
          e.classList.toggle("is-error", kind === "error");

          var icon = $("empty-icon");
          var title = $("empty-title");
          var text = $("empty-text");
          var hint = $("empty-hint");

          if (kind === "noconn") {
            icon.textContent = "🔌";
            title.textContent = t("state.noconn.title");
            text.textContent = t("state.noconn.text");
            hint.innerHTML = t("state.noconn.hint");
          } else if (kind === "disconnected") {
            icon.textContent = "🔌";
            title.textContent = t("state.disconnected.title");
            text.textContent = t("state.disconnected.text");
            hint.innerHTML = t("state.disconnected.hint");
          } else if (kind === "error") {
            icon.textContent = "⚠️";
            title.textContent = t("state.error.title");
            text.textContent = store.lastError;
            hint.textContent = "";
          } else {
            icon.textContent = "💳";
            title.textContent = t("state.waiting.title");
            text.textContent = t("state.waiting.text");
            hint.textContent = "";
          }
        }

        function render() {
          // Only #data is rebuilt. #empty and #data are both children of the
          // stage, so clearing the stage itself would detach #empty and break
          // every later call to showEmpty().
          var dataHost = $("data");

          if (!store.data) {
            // store.conn.ever is sticky: it records that a transport connected
            // at some point, so a later disconnect must not put the page back
            // to "not connected to the agent" when the agent is in fact running
            // and simply idle.
            var kind = store.lastError
              ? "error"
              : store.conn.sio || store.conn.ws
              ? "waiting"
              : store.conn.ever
              ? "disconnected"
              : "noconn";
            showEmpty(kind);
            clear(dataHost);
            dataHost.hidden = true;
            // With no card read, an applet is not "switched off" — it simply
            // has nothing to report. Sending someone to Settings here would
            // reconfigure an agent that is working fine.
            $("blocks").hidden = true;
            applySidebars();
            return;
          }

          $("empty").hidden = true;
          clear(dataHost);

          var isTable = store.ui.view === "table";
          var node = isTable ? renderTable() : renderCard();
          if (!isTable) {
            node.classList.add("flash");
            node.addEventListener("animationend", function () {
              node.classList.remove("flash");
            });
          }
          dataHost.hidden = false;
          dataHost.appendChild(node);

          // The table already lists every leaf, including the applets the
          // blocks below would show. Rendering both is duplicated ink.
          $("blocks").hidden = isTable;
          if (!isTable) renderBlocks();
          applySidebars();
        }

        // Leaf fields the card actually filled in. Takes the payload explicitly
        // because the event log renders before store.data is assigned.
        function countFilled(data) {
          var src = data || store.data;
          if (!src) return 0;
          var n = 0;
          GROUPS.forEach(function (g) {
            if (g.meta) return;
            g.fields.forEach(function (f) {
              var v = get(src, f.path);
              if (v !== undefined && v !== null && String(v).length) n++;
            });
          });
          if (get(src, "personal.base64_img")) n++;
          return n;
        }

        function applySidebars() {
          $("panel-json").hidden = !store.ui.json;
          if (store.ui.json) {
            $("json-out").textContent = store.data
              ? JSON.stringify(store.data, null, 2)
              : t("no.data");
            $("json-count").textContent = store.data ? countFilled() + " fields" : "";
          }
          $("panel-log").hidden = !store.ui.log;
        }

        /* ------------------------------ log -------------------------------- */
        var logRows = [];

        function addLog(ev, msg) {
          var d = new Date();
          var pad = function (n) {
            return String(n).padStart(2, "0");
          };
          logRows.unshift({
            t: pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()),
            ev: ev,
            m: msg || ""
          });
          if (logRows.length > 120) logRows.pop();

          var host = $("log");
          clear(host);
          logRows.forEach(function (r) {
            var row = make("div", "log-row");
            row.appendChild(make("span", "t", r.t));
            row.appendChild(make("span", "ev " + r.ev.replace(/[^a-z-]/g, ""), r.ev));
            row.appendChild(make("span", "m", r.m));
            host.appendChild(row);
          });
          $("log-count").textContent = String(logRows.length);
        }

        /* ---------------------------- event handling ----------------------- */
        function handleEvent(ev, payload, source) {
          if (ev === "smc-command-result") {
            var pending = payload && pendingCommands.get(payload.request_id);
            if (!pending) return false;
            if (payload.status !== "accepted") {
              clearTimeout(pending.timer);
              pendingCommands.delete(payload.request_id);
              if (payload.status !== "completed") toast(store.ui.lang === "th" ? "คำสั่งไม่สำเร็จ: " + payload.code : "Command failed: " + payload.code);
            }
            addLog(ev, payload.status);
            return true;
          }
          addLog(ev, describe(ev, payload));

          if (ev === "smc-status") {
            applyStatus(payload);
            return true;
          }

          if (ev === "smc-data") {
            store.data = payload;
            store.lastError = "";
            // payload.reader is the reader the agent actually read from.
            // smc-inserted only carries a name parsed out of a message, so it
            // is the fallback rather than the source.
            if (payload && typeof payload.reader === "string" && payload.reader) {
              store.reader = payload.reader;
              $("pill-reader").hidden = false;
              $("txt-reader").textContent = store.reader;
            }
            $("pill-time").hidden = false;
            var d = new Date();
            $("txt-time").textContent = d.toLocaleTimeString();
            // A pending clear belongs to a previous removal. A card is in the
            // reader again, so the countdown must not wipe what is on screen
            // while someone is still reading it.
            if (clearTimer) {
              clearTimeout(clearTimer);
              clearTimer = null;
            }
            render();
            return true;
          }

          if (ev === "smc-inserted") {
            // The agent prefixes this with "Connected to "; strip it once here
            // so the pill and the card footer show the same clean reader name.
            store.reader = ((payload && payload.message) || "").replace(
              /^Connected to\s*/i,
              ""
            );
            $("pill-reader").hidden = false;
            $("txt-reader").textContent = store.reader;
            render();
            return true;
          }

          if (ev === "smc-removed") {
            store.reader = "";
            $("pill-reader").hidden = true;
            // Auto-clear is tied to removal, not to the read: a card left in
            // the reader must keep its data on screen.
            if (store.ui.autoclear > 0) {
              scheduleClear(store.ui.autoclear);
            } else {
              clearData();
            }
            return true;
          }

          if (ev === "smc-error") {
            store.lastError = (payload && payload.message) || "unknown error";
            if (!store.data) render();
            return true;
          }

          void source;
          return false;
        }

        function describe(ev, p) {
          if (ev === "smc-data") {
            if (!p) return "";
            var n = countFilled(p) + " fields received";
            return p.reader ? n + " · " + p.reader : n;
          }
          if (ev === "smc-status") {
            if (!p) return "";
            var count = Array.isArray(p.readers) ? p.readers.length : 0;
            return "state=" + (p.state || "-") + " readers=" + count + " selected=" + (p.selected || "-");
          }
          return (p && p.message) || "";
        }

        var clearTimer = null;

        function scheduleClear(seconds) {
          if (clearTimer) clearTimeout(clearTimer);
          clearTimer = setTimeout(function () {
            clearData();
            clearTimer = null;
          }, seconds * 1000);
        }

        function clearData() {
          $("lightbox").hidden = true;
          $("lightbox-img").removeAttribute("src");
          store.data = null;
          $("pill-time").hidden = true;
          render();
        }

        // The reader that produced what is on screen. smc-data carries it as
        // data; smc-inserted only carries a name inside prose, so it stands in
        // when the payload has none (an agent that has not been updated yet,
        // or a read that arrived before the insert notification).
        function currentReader() {
          var r = store.data && store.data.reader;
          if (r) return String(r);
          return store.reader || "";
        }

        var STATES = {
          waiting: { dot: "", text: "pill.waiting" },
          reading: { dot: "wait", text: "pill.reading" },
          "card-present": { dot: "on", text: "pill.cardPresent" }
        };

        function applyStatus(p) {
          if (!p) return;

          // Reader names come off the host, so only strings are kept and they
          // reach the DOM through textContent (see make()).
          var list = [];
          if (Array.isArray(p.readers)) {
            p.readers.forEach(function (r) {
              if (typeof r === "string" && r && list.indexOf(r) === -1) list.push(r);
            });
          }
          store.readers = list;

          // What the agent watches is its own configuration; a name that is
          // not attached means it fell back to watching all of them.
          var pick = p.selected;
          if (typeof pick !== "string" || list.indexOf(pick) === -1) pick = "";
          store.selected = pick;

          store.state = Object.prototype.hasOwnProperty.call(STATES, p.state) ? p.state : "";

          renderStatePill();
          fillReaders(list, pick);
          syncReaderUI();
        }

        function renderStatePill() {
          var pill = $("pill-state");
          var s = STATES[store.state];
          if (!s) {
            pill.hidden = true;
            return;
          }
          pill.hidden = false;
          $("dot-state").className = s.dot ? "dot " + s.dot : "dot";
          $("txt-state").textContent = t(s.text);
        }

        function fillReaders(list, selected) {
          // A display, not a picker: the watched reader changes in /settings.
          // An empty selection is the agent watching every attached reader.
          $("txt-watch").textContent = selected || t("reader.all");
        }

        // Everything smc-status drives is refreshed from one place, so an
        // event, a reconnect and a language switch cannot leave these controls
        // half-updated.
        function syncReaderUI() {
          // The agent's state is the only input: a card that is in and has
          // been read is the only thing a second read can improve on. Nothing
          // here consults the event log.
          var ready = store.state === "card-present";
          var busy = store.state === "reading";
          var btn = $("btn-read-now");
          btn.disabled = !ready;
          btn.setAttribute("aria-busy", busy ? "true" : "false");
          // The busy state is spelled out in the label, so it does not rely on
          // a greyed-out button to be understood.
          btn.textContent = busy ? t("act.readAgainBusy") : t("act.readAgain");

          var note = "";
          if (store.readers.length === 0) note = "reader.note.none";
          else if (busy) note = "reader.note.reading";
          else if (ready) note = "reader.note.ready";
          $("reader-note").textContent = note ? t(note) : "";
        }

        /* ---------------------------- transport --------------------------- */
        var ws = null;
        var wsRetry = 0;
        var wsTimer = null;

        function setConn(which, ok, labelKey) {
          store.conn[which] = ok;
          if (ok) store.conn.ever = true;
          var dot = $("dot-" + which);
          var txt = $("txt-" + which);
          dot.className = "dot " + (ok ? "on" : "off");
          txt.textContent = ok ? t("conn.connected") : t(labelKey || "conn.disconnected");
          if (!ok && !store.conn.sio && !store.conn.ws) {
            // Nothing is watching a reader any more, so a stale "card in" would
            // be a claim about a process that is gone.
            store.state = "";
            renderStatePill();
            syncReaderUI();
          }
          // The first transport to come up has to repaint the empty state:
          // boot rendered "cannot reach the agent" while nothing was connected,
          // and nothing repaints again until a card event arrives, so the panel
          // would sit at noconn under a green pill. With data on screen there
          // is nothing to repaint — and no re-flash of the card either.
          if (ok && !store.data) render();
          if (!ok && !store.conn.ever) render();
        }

        // Set by boot from /api/info: whether the agent serves socket.io at
        // all. When it does not, the CDN script is never fetched and the pill
        // reads disabled rather than offline.
        var sioEnabled = false;

        function setSioDisabled() {
          var dot = $("dot-sio");
          dot.className = "dot off";
          $("txt-sio").textContent = t("conn.disabled");
          $("pill-sio").title = "socket.io is switched off in config.toml ([server] transports)";
          window.smcSocket = null;
        }

        function loadSocketIOClient(then) {
          var script = document.createElement("script");
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.js";
          script.onload = then;
          script.onerror = function () {
            window.__smcSocketIOCDNFailed = true;
            then();
          };
          document.head.appendChild(script);
        }

        function connectSocketIO() {
          if (!sioEnabled) {
            setSioDisabled();
            return;
          }
          if (typeof window.io !== "function") {
            var dot = $("dot-sio");
            dot.className = "dot off";
            $("txt-sio").textContent = t("conn.offline");
            $("pill-sio").title = window.__smcSocketIOCDNFailed
              ? "socket.io client could not be loaded from the CDN; WebSocket is carrying the data"
              : "socket.io client unavailable";
            return;
          }

          var socket = window.io.connect(window.location.origin, {
            transports: ["websocket", "polling"]
          });

          socket.on("connect", function () {
            wsRetry = 0;
            setConn("sio", true);
            // Ask on this transport too. These used to go out only on the
            // WebSocket open, so a page that reached the agent over socket.io
            // alone never learned the options or the reader list and sat with
            // its switches wrong until something else changed.
            window.smcSocket = socket;
            sendCommand({ action: "get-status" });
          });
          socket.on("disconnect", function () {
            setConn("sio", false);
          });
          socket.on("connect_error", function () {
            setConn("sio", false, "conn.failed");
          });

          [
            "smc-data",
            "smc-inserted",
            "smc-removed",
            "smc-error",
            "smc-status",
            "smc-command-result"
          ].forEach(function (ev) {
            socket.on(ev, function (payload) {
              handleEvent(ev, payload, "sio");
            });
          });

          // Outbound: the control channel the agent answers with smc-status.
          window.smcSocket = socket;
        }

        var pendingCommands = new Map();
        var commandSequence = 0;
        function sendCommand(obj) {
          var useWS = ws && ws.readyState === WebSocket.OPEN;
          var useSIO = window.smcSocket && window.smcSocket.connected;
          if (!useWS && !useSIO) return false;
          if (pendingCommands.size >= 16) return false;
          var id = Date.now().toString(36) + "-" + (++commandSequence);
          var command = Object.assign({}, obj, {request_id: id});
          var timer = setTimeout(function () {
            pendingCommands.delete(id);
            toast(store.ui.lang === "th" ? "หมดเวลารอผลคำสั่ง" : "Command response timed out");
          }, 30000);
          pendingCommands.set(id, {timer: timer});
          // Send once: both transports can be connected to the same agent.
          if (useWS) ws.send(JSON.stringify(command));
          else window.smcSocket.emit("smc-command", command);
          return true;
        }

        function connectWS() {
          if (!window.WebSocket) {
            setConn("ws", false, "conn.failed");
            return;
          }
          var proto = window.location.protocol === "https:" ? "wss://" : "ws://";
          try {
            ws = new WebSocket(proto + window.location.host + "/ws");
          } catch (e) {
            setConn("ws", false, "conn.failed");
            return;
          }

          ws.onopen = function () {
            wsRetry = 0;
            setConn("ws", true);
            // Ask for the readers, the watched one and the card state: the
            // read-again button is driven by that payload alone, so without
            // it the button starts out disabled.
            sendCommand({ action: "get-status" });
          };

          ws.onclose = function () {
            setConn("ws", false);
            if (wsTimer) clearTimeout(wsTimer);
            wsRetry = Math.min(wsRetry + 1, 6);
            wsTimer = setTimeout(connectWS, Math.min(1000 * wsRetry, 10000));
          };

          ws.onerror = function () {
            setConn("ws", false, "conn.failed");
          };

          // One JSON object per frame — {event, payload}. The old page split on
          // newlines, which this server never emits.
          ws.onmessage = function (evt) {
            if (typeof evt.data !== "string") return;
            var msg;
            try {
              msg = JSON.parse(evt.data);
            } catch (e) {
              return;
            }
            if (!msg || !msg.event) return;
            handleEvent(msg.event, msg.payload, "ws");
          };
        }

        /* ------------------------------ options --------------------------- */
        function applyPrivacyPreset(name) {
          var preset = PRIVACY[name];
          if (!preset) return;
          store.ui.mask = preset.mask;
          store.ui.maskphoto = preset.maskphoto;
          store.ui.photo = preset.photo;
          store.ui.json = preset.json;
          store.ui.autoclear = preset.autoclear;
          store.ui.nameparts = preset.nameparts;
          store.ui.parts = preset.parts;
          syncControls();
        }

        function syncControls() {
          $("opt-photo").checked = store.ui.photo;
          $("opt-parts").checked = store.ui.parts;
          $("opt-nameparts").checked = store.ui.nameparts;
          $("opt-json").checked = store.ui.json;
          $("opt-log").checked = store.ui.log;
          $("opt-mask").checked = store.ui.mask;
          $("opt-maskphoto").checked = store.ui.maskphoto;
          $("opt-autoclear").value = String(store.ui.autoclear);

          document.documentElement.setAttribute("data-privacy", store.ui.privacy);
          document.documentElement.setAttribute("data-view", store.ui.view);
          document.documentElement.setAttribute("data-lang", store.ui.lang);

          // The segs live here, not only in applyI18n: the view click path
          // runs syncControls without applyI18n, and a seg that only re-syncs
          // on a language change would highlight the old view.
          markSeg("seg-privacy", store.ui.privacy);
          markSeg("seg-view", store.ui.view);
          markSeg("seg-lang", store.ui.dataLang);
          markSeg("seg-uilang", store.ui.lang);
        }

        function markSeg(segId, value) {
          var seg = $(segId);
          if (!seg) return;
          Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
            b.setAttribute("aria-pressed", b.dataset.v === value ? "true" : "false");
          });
        }

        function applyI18n() {
          Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
            n.textContent = t(n.dataset.i18n);
          });
          $("privacy-note").textContent = t("privacy." + store.ui.privacy);
          markSeg("seg-privacy", store.ui.privacy);
          markSeg("seg-view", store.ui.view);
          markSeg("seg-lang", store.ui.dataLang);
          markSeg("seg-uilang", store.ui.lang);
          // The read-again label and the note are written by syncReaderUI, so a
          // language switch has to run it again.
          renderStatePill();
          syncReaderUI();
        }

        function copyAll() {
          if (!store.data) return;
          copyText(JSON.stringify(store.data, null, 2)).then(
            function () {
              toast(t("act.copied"));
            },
            function () {
              toast(t("copy.failed"), true);
            }
          );
        }

        function wireControls() {
          $("seg-privacy").addEventListener("click", function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            store.ui.privacy = b.dataset.v;
            applyPrivacyPreset(store.ui.privacy);
            savePrefs();
            applyI18n();
            render();
          });

          $("seg-view").addEventListener("click", function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            store.ui.view = b.dataset.v;
            syncControls();
            savePrefs();
            render();
          });

          $("seg-lang").addEventListener("click", function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            // This seg is the card data language, not the interface language —
            // the app bar's seg-uilang owns that one.
            store.ui.dataLang = b.dataset.v;
            syncControls();
            savePrefs();
            render();
          });

          $("seg-uilang").addEventListener("click", function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            store.ui.lang = b.dataset.v;
            savePrefs();
            syncControls();
            applyI18n();
            render();
          });

          var simple = [
            "opt-photo",
            "opt-parts",
            "opt-nameparts",
            "opt-json",
            "opt-log",
            "opt-mask",
            "opt-maskphoto"
          ];
          simple.forEach(function (id) {
            $(id).addEventListener("change", function () {
              store.ui[id.replace("opt-", "")] = $(id).checked;
              savePrefs();
              render();
            });
          });

          $("opt-autoclear").addEventListener("change", function () {
            store.ui.autoclear = Number($("opt-autoclear").value);
            savePrefs();
            render();
          });

          $("btn-readers-refresh").addEventListener("click", function () {
            if (!sendCommand({ action: "refresh-readers" })) {
              toast(t("state.noconn.title"), true);
            }
          });

          $("btn-read-now").addEventListener("click", function () {
            // Checked against the payload-driven state rather than the disabled
            // attribute, so a queued keypress cannot send a second read.
            if (store.state !== "card-present") return;
            if (!sendCommand({ action: "read-now" })) {
              toast(t("state.noconn.title"), true);
            }
          });

          $("btn-copy").addEventListener("click", copyAll);
          $("btn-reset").addEventListener("click", function () {
            var base = {};
            for (var k in DEFAULTS) base[k] = DEFAULTS[k];
            store.ui = base;
            applyPrivacyPreset(store.ui.privacy);
            savePrefs();
            applyI18n();
            render();
          });

          // Sidebar collapse is a shell preference, so it is saved with the
          // rest and both pages follow it.
          $("btn-side-hide").addEventListener("click", function () {
            store.ui.sideHidden = true;
            savePrefs();
            document.documentElement.classList.add("side-hidden");
          });
          $("btn-side-show").addEventListener("click", function () {
            store.ui.sideHidden = false;
            savePrefs();
            document.documentElement.classList.remove("side-hidden");
          });

          $("lightbox").addEventListener("click", function () {
            $("lightbox").hidden = true;
            $("lightbox-img").removeAttribute("src");
          });

          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && !$("lightbox").hidden) {
              $("lightbox").hidden = true;
              $("lightbox-img").removeAttribute("src");
            }
          });
        }

        /* ------------------------------- boot ----------------------------- */
        function boot() {
          // On a first visit the toggles have to follow the mode, otherwise the
          // panel claims "masks the ID number" while the box is unticked.
          if (!hadStoredPrefs) applyPrivacyPreset(store.ui.privacy);
          document.documentElement.classList.toggle("side-hidden", !!store.ui.sideHidden);
          syncControls();
          applyI18n();
          wireControls();
          render();

          // Ask what the agent serves before touching the transports, so a
          // switched-off socket.io shows as disabled, not as a failure, and
          // its CDN script is never fetched. A socket.io failure must not cost
          // the WebSocket path: connectWS runs either way, below.
          var startSIO = function () {
            try {
              connectSocketIO();
            } catch (e) {
              var dot = $("dot-sio");
              dot.className = "dot off";
              $("txt-sio").textContent = t("conn.failed");
            }
          };
          var withoutInfo = function () {
            // No /api/info to ask — an agent built without the settings API.
            // Try the transport, as this page always did.
            sioEnabled = true;
            loadSocketIOClient(startSIO);
          };
          if (window.fetch) {
            fetch("/api/info")
              .then(function (r) {
                return r.ok ? r.json() : null;
              })
              .then(function (info) {
                var transports = info && info.transports;
                if (transports && transports.indexOf("socketio") === -1) {
                  setSioDisabled();
                  return;
                }
                if (!transports) {
                  withoutInfo();
                  return;
                }
                sioEnabled = true;
                loadSocketIOClient(startSIO);
              })
              .catch(withoutInfo);
          } else {
            withoutInfo();
          }
          connectWS();

          // Give the transports a moment, then correct the empty state if
          // nothing managed to connect at all.
          setTimeout(function () {
            if (!store.conn.sio && !store.conn.ws && !store.data) render();
          }, 1200);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
