<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>SMC — Settings</title>
    <style>
      /* ---------------------------------------------------------------------
         Design system: "แผงควบคุมเครื่องอ่านบัตร" — the same light admin
         shell as the card page: one white app bar and sidebar on a quiet
         mint-gray desk, one accent (the Thai ID card's deep green) meaning
         action or state, hairlines and whitespace everywhere else. The
         heading of each group names the TOML table the fields write to.
         --------------------------------------------------------------------- */
      :root {
        --bg: #f4f6f5;
        --surface: #ffffff;
        --surface-2: #f0f4f2;
        --line: #e1e7e4;
        --line-soft: #ebefed;
        --fg: #17251f;
        --fg-dim: #5a6b64;
        --fg-faint: #8d9c95;
        --accent: #0c7a5b;
        --accent-deep: #095f47;
        --accent-soft: #e2f1ea;
        --ok: #17855c;
        --warn: #b45309;
        --danger: #d64550;
        --radius: 12px;
        --appbar-h: 57px;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: "Sukhumvit Set", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans Thai", "Leelawadee UI", Sarabun, Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ----------------------------- app bar ----------------------------- */
      .appbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        min-height: var(--appbar-h);
        padding: 8px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--fg);
        font-weight: 700;
        letter-spacing: 0.01em;
        margin-right: auto;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, #0d805f, #085c45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        display: grid;
        place-items: center;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.07em;
        color: #fff;
        flex: none;
      }
      .brand small {
        color: var(--fg-faint);
        font-weight: 550;
        font-size: 13px;
      }
      .iconbtn {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        color: var(--fg-dim);
        background: transparent;
        border: 1px solid transparent;
        flex: none;
      }
      .iconbtn:hover {
        background: var(--surface-2);
        color: var(--fg);
        border-color: var(--line);
      }

      /* Sidebar collapse: the hide button sits at the sidebar's top-right,
         and once it is hidden the same icon appears in the app bar to bring
         it back. The choice is a preference shared with the card page. */
      .side-top {
        display: flex;
        justify-content: flex-end;
        padding: 6px 10px 0;
      }
      .side-open { display: none; margin-right: 2px; }
      html.side-hidden .side-open { display: inline-grid; }
      html.side-hidden .sidebar { display: none !important; }
      html.side-hidden .shell { grid-template-columns: minmax(0, 1fr); }

      /* ------------------------------ shell ------------------------------ */
      .shell {
        display: grid;
        grid-template-columns: 266px minmax(0, 1fr);
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: var(--appbar-h);
        height: calc(100vh - var(--appbar-h));
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 14px 0 28px;
      }
      .nav {
        display: grid;
        gap: 2px;
        padding: 0 12px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--fg-dim);
        font-size: 13.5px;
        font-weight: 550;
      }
      .nav-item svg { flex: none; color: var(--fg-faint); }
      .nav-item:hover { background: var(--surface-2); color: var(--fg); }
      .nav-item:hover svg { color: var(--fg-dim); }
      .nav-item.is-active {
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-weight: 650;
      }
      .nav-item.is-active svg { color: var(--accent); }

      main {
        padding: 24px 28px 48px;
        width: 100%;
        max-width: 1030px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      /* Sections are quiet form groups: white cards with hairlines, headed by
         the TOML table the fields write to. */
      section {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 18px 18px;
      }
      h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
      h2 small {
        color: var(--fg-faint);
        font-weight: 500;
        font-family: var(--mono);
        font-size: 12px;
        background: var(--surface-2);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 1px 7px;
      }
      .hint { color: var(--fg-dim); font-size: 13px; margin: 2px 0 10px; }
      .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
      .row > label, .row label[for] { min-width: 150px; color: var(--fg-dim); }
      input[type="text"], input[type="number"], input[type="password"], textarea {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        font-family: var(--mono);
        font-size: 14px;
      }
      input[type="text"] { width: 220px; }
      input[type="number"] { width: 110px; }
      textarea { width: 100%; resize: vertical; line-height: 1.6; }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(12, 122, 91, 0.16);
      }
      select {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        font-family: var(--sans);
        font-size: 14px;
        max-width: 100%;
      }
      .reader-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .reader-line select { min-width: 260px; }

      /* The ⓘ tip: the long explanation lives here instead of a paragraph
         under every row. Keyboard users get it on focus, touch users on tap. */
      .tipwrap { position: relative; display: inline-flex; }
      .tip {
        display: inline-grid;
        place-items: center;
        width: 17px;
        height: 17px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--surface-2);
        color: var(--fg-dim);
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 600;
        font-style: italic;
        line-height: 1;
        cursor: help;
      }
      .tip:hover, .tip:focus { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-soft); }
      .tipbox {
        position: absolute;
        top: calc(100% + 8px);
        right: -6px;
        width: min(300px, 76vw);
        background: #1d2b25;
        color: #f2f6f4;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 12.5px;
        line-height: 1.55;
        font-weight: 400;
        text-align: left;
        box-shadow: 0 12px 28px -12px rgba(13, 22, 18, 0.5);
        opacity: 0;
        transform: translateY(-2px);
        pointer-events: none;
        transition: opacity 0.12s, transform 0.12s;
        z-index: 30;
      }
      .tip:hover + .tipbox, .tip:focus + .tipbox { opacity: 1; transform: none; }
      .checks { display: grid; gap: 7px; }
      .checks label { display: flex; gap: 8px; align-items: baseline; }
      input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }
      .note { color: var(--fg-dim); font-size: 13px; }
      .warning { color: var(--warn); font-size: 13px; }
      .error { color: var(--danger); font-size: 13px; }
      .ok { color: var(--ok); font-size: 13px; }
      code, .token {
        font-family: var(--mono);
        font-size: 13px;
        background: var(--surface-2);
        border: 1px solid var(--line-soft);
        color: var(--accent-deep);
        border-radius: 6px;
        padding: 5px 9px;
        word-break: break-all;
      }
      code { padding: 2px 6px; }

      button {
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-family: var(--sans);
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
      button.secondary {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        font-weight: 550;
      }
      button.secondary:hover { background: var(--surface-2); border-color: var(--fg-faint); }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: var(--accent); border-color: var(--accent); }
      button.secondary:disabled:hover { background: var(--surface); border-color: var(--line); }

      #endpoint-moved { color: var(--warn); font-size: 13px; }
      #endpoint-link { color: var(--fg); font-weight: 600; text-underline-offset: 3px; }

      .savebar {
        display: grid;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: var(--radius);
        padding: 16px 18px;
      }
      .savebar .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

      @media (max-width: 1080px) {
        .shell { grid-template-columns: minmax(0, 1fr); }
        /* Same unpacking as the card page: nav above, then content. */
        .sidebar { display: contents; }
        .sidebar > .side-top {
          order: -2;
          padding: 4px 12px 0;
        }

        .sidebar > .nav {
          order: -1;
          background: var(--surface);
          border-bottom: 1px solid var(--line);
          padding: 12px;
        }
        .sidebar > .side-sec { order: 1; background: var(--surface); }
        main { padding: 20px 16px 40px; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
      </style>
  </head>
      <body>
    <header class="appbar">
      <button
        class="iconbtn side-open"
        id="btn-side-show"
        type="button"
        aria-label="แสดงเมนูข้าง / Show sidebar"
        title="แสดงเมนูข้าง / Show sidebar"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" />
          <path d="M6.25 2.75v10.5" />
        </svg>
      </button>
      <a class="brand" href="/">
        <span class="brand-mark">SMC</span>
        <span class="brand-name">Thai ID Card Agent</span>
      </a>

      <div class="seg langseg" id="seg-uilang" role="group" aria-label="ภาษาหน้าจอ / Interface language">
        <button type="button" data-v="th">ไทย</button>
        <button type="button" data-v="en">EN</button>
      </div>

      <a
        class="iconbtn"
        href="https://github.com/somprasongd/go-thai-smartcard"
        target="_blank"
        rel="noopener"
        aria-label="GitHub repository"
        title="GitHub"
      >
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <div class="side-top">
          <button
            class="iconbtn"
            id="btn-side-hide"
            type="button"
            aria-label="ซ่อนเมนูข้าง / Hide sidebar"
            title="ซ่อนเมนูข้าง / Hide sidebar"
          >
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" />
          <path d="M6.25 2.75v10.5" />
        </svg>
          </button>
        </div>

        <nav class="nav" aria-label="หน้าหลัก">
          <a class="nav-item" href="/">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <rect x="1.75" y="3.25" width="12.5" height="9.5" rx="1.8" />
              <path d="M1.75 6.25h12.5" />
              <path d="M4.25 9.75h3" />
            </svg>
            <span data-i18n="nav.card">อ่านบัตร</span>
          </a>
          <a class="nav-item is-active" href="/settings" aria-current="page">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <path d="M2 4.5h4.2M9.6 4.5H14M2 11.5h1.9M7.3 11.5H14" />
              <circle cx="8.4" cy="4.5" r="1.85" />
              <circle cx="5.2" cy="11.5" r="1.85" />
            </svg>
            <span data-i18n="nav.settings">ตั้งค่า</span>
          </a>
        </nav>
      </aside>

      <main>
        <div class="error" id="boot-error" hidden></div>

        <section id="sec-stale">
          <h2 data-i18n="stale.title">ข้อมูลบัตรเมื่อการเชื่อมต่อขาด</h2>
          <p class="note" data-i18n="stale.help"></p>
          <div class="row"><label for="stale-mode" data-i18n="stale.mode"></label><select id="stale-mode">
            <option value="auto" data-i18n="stale.auto"></option>
            <option value="clear" data-i18n="stale.clear"></option>
            <option value="keep" data-i18n="stale.keep"></option>
            <option value="delay" data-i18n="stale.delay"></option>
          </select></div>
          <div class="row" id="stale-delay-row" hidden><label for="stale-seconds" data-i18n="stale.seconds"></label><input id="stale-seconds" type="number" min="5" max="3600" step="1" value="30"></div>
          <button type="button" id="btn-stale-save" data-i18n="stale.save"></button>
          <p class="note" id="stale-save-status" role="status"></p>
        </section>

        <section id="sec-logging">
          <h2 data-i18n="log.title">บันทึกการทำงาน</h2>
          <p class="note" data-i18n="log.help"></p>
          <div class="row"><label for="log-mode" data-i18n="log.mode"></label><select id="log-mode"><option value="auto">auto</option><option value="file">file</option><option value="console">console</option></select></div>
          <div class="row"><label for="log-size" data-i18n="log.size"></label><input id="log-size" type="number" min="1" max="1024" required></div>
          <div class="row"><label for="log-backups" data-i18n="log.backups"></label><input id="log-backups" type="number" min="0" max="1000" required></div>
          <div class="row"><label for="log-age" data-i18n="log.age"></label><input id="log-age" type="number" min="0" max="36500" required></div>
          <p id="log-usage" class="note" role="status"></p>
          <p id="log-restart" class="warning" hidden data-i18n="log.restart"></p>
          <a href="/diagnostics" data-i18n="log.diagnostics"></a>
        </section>

        <section id="sec-server">
          <h2>
            Server <small>[server]</small>
            <span class="tipwrap">
              <button type="button" class="tip" aria-label="Server">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.server"></span>
            </span>
          </h2>
          <div class="row" id="expose-row">
            <label>listen</label>
            <span class="checks" style="display: flex; gap: 16px">
              <label><input type="checkbox" id="expose" /> <span data-i18n="opt.expose"></span></label>
            </span>
            <span class="tipwrap">
              <button type="button" class="tip" aria-label="Expose">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.expose"></span>
            </span>
          </div>
          <div class="row" id="listen-row" hidden>
            <label for="listen">listen <small>(<span data-i18n="listen.custom">กำหนดเอง</span>)</small></label>
            <input type="text" id="listen" spellcheck="false" />
            <span class="tipwrap">
              <button type="button" class="tip" aria-label="Listen">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.listen"></span>
            </span>
          </div>
          <div class="row">
            <label for="port">port</label>
            <input type="number" id="port" min="1" max="65535" />
          </div>
          <div class="row">
            <label>transports</label>
            <span class="checks" style="display: flex; gap: 16px">
              <label><input type="checkbox" id="t-ws" /> WebSocket (default)</label>
              <label><input type="checkbox" id="t-socketio" /> socket.io (opt-in)</label>
            </span>
          </div>
          <div class="row" style="display: block">
            <label for="origins">allowed_origins — <span data-i18n="origins.perline">หนึ่ง origin ต่อบรรทัด</span></label>
            <span class="tipwrap" style="vertical-align: -3px">
              <button type="button" class="tip" aria-label="allowed_origins">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.origins"></span>
            </span>
            <textarea id="origins" rows="3" spellcheck="false"></textarea>
            <p class="warning" id="wildcard-warning" hidden data-i18n="warn.wildcard"></p>
          </div>
        </section>

        <!-- A loopback token is inert: the guard enforces it only beyond
             loopback, so the whole section hides until exposure is on. -->
        <section id="token-section" hidden>
          <h2>
            Socket token <small>[server] token</small>
            <span class="tipwrap">
              <button type="button" class="tip" aria-label="Socket token">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.token"></span>
            </span>
          </h2>
          <div class="row">
            <span data-i18n="token.status">สถานะ:</span>
            <span id="token-state" class="note"></span>
            <button class="secondary" id="btn-token" data-i18n="token.generate">สร้าง token</button>
          </div>
          <div id="token-reveal" hidden>
            <p class="warning" data-i18n="token.reveal"></p>
            <div class="row">
              <span class="token" id="token-value"></span>
              <button class="secondary" id="btn-copy" data-i18n="act.copy"></button>
            </div>
          </div>
        </section>

        <section id="sec-card">
          <h2>
            Card <small>[card]</small>
            <span class="tipwrap">
              <button type="button" class="tip" aria-label="Card">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.card"></span>
            </span>
          </h2>
          <div class="checks">
            <label><input type="checkbox" id="c-face" /> <span data-i18n="c.face"></span></label>
            <label><input type="checkbox" id="c-laser" /> <span data-i18n="c.laser"></span></label>
            <label><input type="checkbox" id="c-nhso" /> <span data-i18n="c.nhso"></span></label>
          </div>
          <div class="row" style="display: block">
            <div class="reader-line">
              <label for="reader">reader</label>
              <!-- The list is the newest reader status the agent broadcast;
                   a saved reader that is not attached stays selectable so the
                   setting never changes silently, labelled as unavailable. -->
              <select id="reader" spellcheck="false"></select>
              <button class="secondary" id="btn-reader-refresh" type="button" data-i18n="reader.refresh"></button>
            </div>
            <p class="note" id="reader-status"></p>
          </div>
        </section>

        <section id="sec-tls">
          <h2>
            TLS <small>[tls]</small>
            <span class="tipwrap">
              <button type="button" class="tip" aria-label="TLS">i</button>
              <span class="tipbox" role="tooltip" data-i18n="tip.tls"></span>
            </span>
          </h2>
          <div class="checks">
            <label><input type="checkbox" id="tls-enabled" /> <span data-i18n="tls.enable">เปิด HTTPS</span></label>
          </div>
          <div class="row">
            <label for="tls-port">port</label>
            <input type="number" id="tls-port" min="1" max="65535" />
          </div>
          <div class="row">
            <label for="tls-cert">cert_file</label>

        var uiLang = "th";

        function t(key) {
          var dict = I18N[uiLang] || I18N.th;
          return dict[key] !== undefined ? dict[key] : I18N.th[key] || key;
        }

        // The card page stores its own choices under smc.prefs; the interface
        // language reads and writes just that one field so the two pages
        // follow one switch without touching the rest.
        function detectLang() {
          try {
            var raw = localStorage.getItem("smc.prefs");
            if (raw) {
              var saved = JSON.parse(raw);
              if (saved && (saved.lang === "en" || saved.lang === "th")) return saved.lang;
            }
          } catch (e) {
            /* private mode or no storage — Thai it is */
          }
          return "th";
        }

        function saveLang(lang) {
          try {
            var prefs = {};
            var raw = localStorage.getItem("smc.prefs");
            if (raw) prefs = JSON.parse(raw) || {};
            prefs.lang = lang;
            localStorage.setItem("smc.prefs", JSON.stringify(prefs));
          } catch (e) {
            /* nothing to do */
          }
        }

        // The sidebar collapse is a shell preference shared with the card
        // page: read and write only the one field, like the language.
        var shellHidden = false;

        function detectShell() {
          try {
            var raw = localStorage.getItem("smc.prefs");
            if (raw) {
              var saved = JSON.parse(raw);
              shellHidden = !!(saved && saved.sideHidden);
            }
          } catch (e) { /* default is visible */ }
          document.documentElement.classList.toggle("side-hidden", shellHidden);
        }

        function setShellHidden(hidden) {
          shellHidden = hidden;
          document.documentElement.classList.toggle("side-hidden", shellHidden);
          try {
            var prefs = {};
            var raw = localStorage.getItem("smc.prefs");
            if (raw) prefs = JSON.parse(raw) || {};
            prefs.sideHidden = shellHidden;
            localStorage.setItem("smc.prefs", JSON.stringify(prefs));
          } catch (e) { /* nothing to do */ }
        }

        function applyLang() {
          $("stale-save-status").textContent = "";
          document.documentElement.setAttribute("lang", uiLang);
          Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
            n.textContent = t(n.dataset.i18n);
          });
          markSeg("seg-uilang", uiLang);
          state.tokenSet ? showTokenSet() : showTokenMissing();
        }

        function $(id) {
          return document.getElementById(id);
        }

        function markSeg(segId, value) {
          var seg = $(segId);
          if (!seg) return;
          Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
            b.setAttribute("aria-pressed", b.dataset.v === value ? "true" : "false");
          });
        }

        function setStatus(text, cls) {
          var el = $("save-status");
          el.textContent = text;
          el.className = cls || "note";
        }

        function bootError(text) {
          var el = $("boot-error");
          el.textContent = text;
          el.hidden = false;
        }

        // The two standard listens get a checkbox, Ollama-style: exposure is
        // one decision and the free-text field invited values whose exposure
        // was hard to predict ("localhost" and "127.0.0.1" agree, a machine's
        // own LAN address silently exposes). Anything else is a deliberate
        // custom bind — a specific interface address — and keeps the field.
        function listenIsStandard(listen) {
          return listen === "127.0.0.1" || listen === "0.0.0.0";
        }

        // Mirrors config.IsLoopbackListen for the common values. The server
        // decides enforcement; this only drives whether the token section is
        // worth showing on an agent that is not exposed.
        function listenIsLoopback(listen) {
          return (
            listen === "localhost" ||
            listen === "::1" ||
            /^127(?:\.\d{1,3}){3}$/.test(listen)
          );
        }

        function effectiveListen() {
          return $("listen-row").hidden
            ? ($("expose").checked ? "0.0.0.0" : "127.0.0.1")
            : $("listen").value.trim();
        }

        function syncTokenSection() {
          $("token-section").hidden = listenIsLoopback(effectiveListen());
        }

        function fill(config, tokenSet) {
          var logging = config.logging || {mode:"auto",max_size_mb:10,max_backups:3,max_age_days:7};
          $("log-mode").value=logging.mode;
          $("log-size").value=logging.max_size_mb;
          $("log-backups").value=logging.max_backups;
          $("log-age").value=logging.max_age_days;
          var listen = config.server.listen || "127.0.0.1";
          $("expose").checked = listen === "0.0.0.0";
          $("expose-row").hidden = !listenIsStandard(listen);
          $("listen-row").hidden = listenIsStandard(listen);
          $("listen").value = listen;
          $("port").value = config.server.port;
          $("t-ws").checked = (config.server.transports || []).indexOf("ws") !== -1;
          $("t-socketio").checked = (config.server.transports || []).indexOf("socketio") !== -1;
          $("origins").value = (config.server.allowed_origins || []).join("\n");
          $("c-face").checked = config.card.read_face_image;
          $("c-laser").checked = config.card.read_laser_id;
          $("c-nhso").checked = config.card.read_nhso;
          $("reader").value = config.card.reader;
          state.reader = config.card.reader;
          state.readersLoaded = false;
          $("tls-enabled").checked = config.tls.enabled;
          $("tls-port").value = config.tls.port;
          $("tls-cert").value = config.tls.cert_file;
          $("tls-key").value = config.tls.key_file;
          tokenSet ? showTokenSet() : showTokenMissing();
          syncWarnings();
          syncTokenSection();
        }

        function collect() {
          var transports = [];
          if ($("t-ws").checked) transports.push("ws");
          if ($("t-socketio").checked) transports.push("socketio");
          var origins = $("origins").value
            .split("\n")
            .map(function (line) { return line.trim(); })
            .filter(function (line) { return line !== ""; });
          return {
            server: {
              listen: $("listen-row").hidden
                ? ($("expose").checked ? "0.0.0.0" : "127.0.0.1")
                : $("listen").value.trim() || "127.0.0.1",
              port: parseInt($("port").value, 10) || 9898,
              transports: transports,
              allowed_origins: origins,
              token: ""
            },
            card: {
              read_face_image: $("c-face").checked,
              read_laser_id: $("c-laser").checked,
              read_nhso: $("c-nhso").checked,
              reader: $("reader").value.trim()
            },
            logging: {mode:$("log-mode").value,max_size_mb:Number($("log-size").value),max_backups:Number($("log-backups").value),max_age_days:Number($("log-age").value)},
            tls: {
              enabled: $("tls-enabled").checked,
              port: parseInt($("tls-port").value, 10) || 9899,
              mode: "files",
              cert_file: $("tls-cert").value.trim(),
              key_file: $("tls-key").value.trim(),
              hostnames: []
            }
          };
        }

        function syncWarnings() {
          var origins = $("origins").value.split("\n").map(function (l) { return l.trim(); });
          $("wildcard-warning").hidden = origins.indexOf("*") === -1;
        }

        function showTokenSet() {
          $("token-state").textContent = t("token.set");
          $("btn-token").textContent = t("token.regenerate");
          state.tokenSet = true;
        }

        function showTokenMissing() {
          $("token-state").textContent = t("token.missing");
          $("btn-token").textContent = t("token.generate");
          state.tokenSet = false;
        }

        function revealToken(token) {
          $("token-value").textContent = token;
          $("token-reveal").hidden = false;
          showTokenSet();
        }

        // The reader list is the newest reader status the agent broadcast
        // (GET /api/readers); the settings page has no card socket of its
        // own. A saved reader that is not in the list stays selectable —
        // dropping it would make the setting change silently — but it is
        // labelled and the note says it is not attached right now.
        function readerOption(value, label) {
          var o = document.createElement("option");
          o.value = value;
          o.textContent = label;
          return o;
        }

        async function loadReaders() {
          var sel = $("reader");
          var status = $("reader-status");
          var current = state.readersLoaded ? sel.value : (state.reader || "");
          var readers = null; // null: the agent did not answer
          try {
            var res = await fetch("/api/readers");
            if (res.ok) {
              readers = (await res.json()).readers || [];
            }
          } catch (e) {}
          var names = readers || [];
          sel.textContent = "";
          sel.appendChild(readerOption("", t("reader.all")));
          names.forEach(function (n) {
            sel.appendChild(readerOption(n, n));
          });
          var missing = current !== "" && names.indexOf(current) === -1;
          if (missing) {
            sel.appendChild(readerOption(current, current + " " + t("reader.notAttached")));
          }
          sel.value = current;
          state.readersLoaded = true;
          if (readers === null) {
            status.textContent = t("rs.unknown");
            status.className = "note";
          } else if (missing) {
            status.textContent = t("rs.missing");
            status.className = "warning";
          } else if (names.length === 0) {
            status.textContent = t("rs.none");
            status.className = "note";
          } else {
            status.textContent = t("rs.found").replace("{n}", names.length);
            status.className = "note";
          }
        }

        async function loadLogUsage() {
          try {
            var r=await fetch("/api/diagnostics");if(!r.ok)throw new Error("unavailable");
            var d=await r.json(),log=d.logging;
            if(!log){$("log-usage").textContent=t("log.unavailable");return;}
            $("log-usage").textContent=!log.file_logging?t("log.console"):!log.usage_available?t("log.unavailable"):t("log.usage").replace("{mb}",(log.bytes/1048576).toFixed(2)).replace("{n}",log.files);
          }catch(e){$("log-usage").textContent=t("log.unavailable");}
        }

        async function load() {
          try {
            var res = await fetch("/api/settings");
            if (!res.ok) {
              bootError(t("err.load") + res.status);
              return;
            }
            var data = await res.json();
            state.version = data.version;
            fill(data.config, data.token_set);
            $("log-restart").hidden=!data.logging_restart_required;
            loadLogUsage();
            loadReaders();
          } catch (e) {
            bootError(t("st.unreach") + e);
          }
        }

        async function save(extra) {
          $("btn-save").disabled = true;
          setStatus(t("st.saving"), "note");
          var body = Object.assign({ config: collect(), version: state.version }, extra || {});
          try {
            var res = await fetch("/api/settings", {
              method: "PUT",
              headers: { "Content-Type": "application/json", "X-SMC-Settings": "1" },
              body: JSON.stringify(body)
            });
            if (res.status === 409) {
              // The file changed on disk since it was served (decision 14).
              setStatus(t("st.conflict"), "error");
              $("btn-reload").hidden = false;
              return;
            }
            if (!res.ok) {
              var text = await res.text();
              setStatus(t("st.failed") + text, "error");
              return;
            }
            var data = await res.json();
            state.version = data.version;
            if (data.token) revealToken(data.token);
            setStatus(t("st.saved") + (data.logging_restart_required ? " — " + t("log.restart") : ""), "ok");
            $("log-restart").hidden=!data.logging_restart_required;
            loadLogUsage();
            if (data.endpoint_url) {
              var target = new URL("/settings", data.endpoint_url);
              if (target.origin !== window.location.origin) {
                if (!$("token-reveal").hidden) {
                  $("endpoint-link").href = target.href;
                  $("endpoint-moved").hidden = false;
                } else {
                  window.location.assign(target.href);
                }
              }
            }
          } catch (e) {
            setStatus(t("st.unreach") + e, "error");
          } finally {
            $("btn-save").disabled = false;
          }
        }

        $("btn-save").addEventListener("click", function () { save(); });
        $("btn-reload").addEventListener("click", function () {
          $("btn-reload").hidden = true;
          $("token-reveal").hidden = true;
          load().then(function () { setStatus(t("st.reloaded"), "note"); });
        });
        $("btn-token").addEventListener("click", function () {
          if (state.tokenSet && !window.confirm(t("token.confirm"))) {
            return;
          }
          save({ regenerate_token: true });
        });
        $("btn-copy").addEventListener("click", function () {
          navigator.clipboard.writeText($("token-value").textContent).then(
            function () { setStatus(t("st.copied"), "ok"); },
            function () { setStatus(t("st.copyFailed"), "error"); }
          );
        });
        $("origins").addEventListener("input", syncWarnings);
        $("expose").addEventListener("change", syncTokenSection);
        $("listen").addEventListener("input", syncTokenSection);
        $("btn-reader-refresh").addEventListener("click", loadReaders);

        $("btn-side-hide").addEventListener("click", function () { setShellHidden(true); });
        $("btn-side-show").addEventListener("click", function () { setShellHidden(false); });

        $("seg-uilang").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          uiLang = b.dataset.v;
          saveLang(uiLang);
          applyLang();
          loadReaders();
        });

        function syncStalePolicy() { $("stale-delay-row").hidden = $("stale-mode").value !== "delay"; }
        function loadStalePolicy() {
          var saved;
          try { saved = JSON.parse(localStorage.getItem("smc.stalePolicy")); } catch (e) {}
          $("stale-mode").value = saved && ["clear","keep","delay"].indexOf(saved.mode) >= 0 ? saved.mode : "auto";
          $("stale-seconds").value = saved && Number.isInteger(saved.seconds) && saved.seconds >= 5 && saved.seconds <= 3600 ? saved.seconds : 30;
          syncStalePolicy();
        }
        $("stale-mode").addEventListener("change", syncStalePolicy);
        $("btn-stale-save").addEventListener("click", function () {
          var mode = $("stale-mode").value, seconds = Number($("stale-seconds").value);
          if (mode === "delay" && (!Number.isInteger(seconds) || seconds < 5 || seconds > 3600)) {
            $("stale-save-status").textContent = t("stale.invalid"); return;
          }
          try {
            if (mode === "auto") localStorage.removeItem("smc.stalePolicy");
            else localStorage.setItem("smc.stalePolicy",JSON.stringify({mode:mode,seconds: mode === "delay" ? seconds : 30}));
            $("stale-save-status").textContent = t("stale.saved");
          } catch (e) { $("stale-save-status").textContent = t("stale.failed"); }
        });
        loadStalePolicy();

        uiLang = detectLang();
        detectShell();
        applyLang();
        load();
      })();
    </script>
  </body>
</html>
